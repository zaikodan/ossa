services:
  postgres:
    image: postgres:16-alpine
    container_name: ossa-postgres
    environment:
      POSTGRES_USER: ossa
      POSTGRES_PASSWORD: ossa
      POSTGRES_DB: ossa
    ports:
      - '5433:5432'
    volumes:
      - ossa-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ossa']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ossa-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ossa-pg:
